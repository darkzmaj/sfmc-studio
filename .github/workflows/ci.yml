name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Docker build
        run: docker build -t sfmc-studio:ci .
      - name: Container smoke test
        run: |
          docker run -d --name sfmc -p 8080:8080 --read-only --tmpfs /tmp --tmpfs /var/cache/nginx --cap-drop ALL sfmc-studio:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8080/editor/some-id
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
