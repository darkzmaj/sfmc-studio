# nginx config for the static SFMC Studio build (runs as non-root on :8080).
# TLS/HSTS are terminated by the reverse proxy (Coolify/Traefik/Caddy).
server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1k;   # nothing is ever uploaded to this server

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

  # Security headers (repeated in nested locations because add_header does not inherit).
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Fingerprinted build output: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    try_files $uri =404;
  }

  # Catalog metadata: cache, but revalidate daily so catalog syncs reach visitors.
  location /catalog/ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    try_files $uri =404;
  }

  location /schema/ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # SPA fallback; the shell itself is never cached so deploys apply immediately.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    try_files $uri $uri/ /index.html;
  }

  # Never serve dotfiles or source maps.
  location ~ /\. { deny all; }
  location ~ \.map$ { deny all; }
}
