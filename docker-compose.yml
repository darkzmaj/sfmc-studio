# Local or Coolify (Docker Compose build pack) deployment.
# Visitor projects live in their browsers; the server never stores them.
# Optional read-only volume: the TF2 asset pack built by scripts/asset-pack.ts (operator's choice).
services:
  sfmc-studio:
    build: .
    image: sfmc-studio:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${ASSET_PACK:-./asset-pack}:/usr/share/nginx/html/tf2:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
